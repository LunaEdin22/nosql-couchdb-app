name: NoSQL App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      couchdb:
        image: couchdb:3.3.3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -f http://localhost:5984/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Launch FastAPI server in background
        env:
          COUCHDB_HOST: localhost
          COUCHDB_PORT: 5984
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
          COUCHDB_DB_NAME: products_db
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 4

      - name: Run API & NoSQL integration tests
        env:
          API_URL: http://localhost:8000
        run: |
          pytest scripts/test_api.py -v

      - name: Run initial database seeding
        env:
          API_URL: http://localhost:8000
        run: |
          python scripts/seed_data.py

  deploy:
    name: Deploy to Cloud
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nosql-couchdb-app:latest

      - name: Trigger Cloud Deployment (Railway / Render / Webhook)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering cloud deploy webhook..."
            curl -X POST "$DEPLOY_WEBHOOK_URL"
            echo "Deployment webhook triggered successfully."
          else
            echo "Notice: DEPLOY_WEBHOOK_URL secret not configured. Build validation succeeded."
            echo "Push to 'main' branch automatically deploys on connected Railway/Render services."
          fi
