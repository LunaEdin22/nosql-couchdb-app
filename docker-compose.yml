version: '3.8'

services:
  couchdb:
    image: couchdb:3.3.3
    container_name: nosql_couchdb
    restart: always
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nosql_fastapi
    restart: always
    environment:
      - COUCHDB_HOST=couchdb
      - COUCHDB_PORT=5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_DB_NAME=products_db
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb_data:
